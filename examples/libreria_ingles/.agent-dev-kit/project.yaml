project:
  name: LibreriaIngles

stack:
  backend:
    language: Python
    framework: FastAPI
  frontend:
    framework: Angular
  ui:
    framework: Bootstrap
  database:
    engine: SQLite

provider:
  name: openai

documentation:
  templates:
    functional_spec: docs/templates/functional-spec.md
    technical_spec: docs/templates/technical-spec.md

orchestration:
  trace:
    path: .agent-dev-kit/runtime/orchestration.jsonl
    retain_request_text: false
    propose_issues: true

git_workflow:
  branches:
    production: main
    integration: development
  protected:
    - main
    - development
  task_branch:
    base: development
    naming: "{kind}/{issue}-{slug}"
  pull_requests:
    task_target: development
    release_source: development
    release_target: main
    require_issue_reference: true
  sync:
    require_updated_base_before_task: true
  direct_writes:
    protected_branches: deny
    exception: explicit_human_authorization

agents:
  enabled:
    - triage
    - pmo
    - architecture
    - ux_ui
    - backend
    - frontend
    - database
    - security
    - testing
    - reviewer
    - documentation
