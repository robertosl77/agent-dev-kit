[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-kit"
version = "0.1.0"
description = "Framework reutilizable de agentes especialistas para desarrollo de software"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
openai = [
  "openai-agents"
]
dev = [
  "pytest>=8.3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
