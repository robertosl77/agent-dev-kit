[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dev-kit"
version = "0.2.0"
description = "Framework reutilizable de agentes especialistas para desarrollo de software"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.scripts]
agent-dev-kit = "agent_dev_kit.cli:main"

[project.optional-dependencies]
openai = [
  "openai-agents>=0.23.1,<0.24"
]
anthropic = [
  "anthropic>=1.11,<2"
]
gemini = [
  "google-genai>=2.28,<3"
]
mcp = [
  "mcp>=2,<3"
]
dev = [
  "pytest>=8.3",
  "mcp>=2,<3",
  "anthropic>=1.11,<2",
  "google-genai>=2.28,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
agent_dev_kit = ["profiles/*.yaml"]
