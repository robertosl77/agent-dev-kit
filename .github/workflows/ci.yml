name: Agent Dev Kit CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Agent Dev Kit CI / test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q


  openai-provider:
    name: Agent Dev Kit CI / openai-provider
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI and MCP extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openai,mcp]"

      - name: Run OpenAI provider contract tests
        run: |
          pytest -q tests/test_provider_openai_smoke.py tests/test_provider_contract.py
